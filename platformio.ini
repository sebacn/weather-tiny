[env:esp32dev]
; Pin to Arduino-ESP32 2.0.17 (matches arduino-config.txt); unpinned pulls 3.x
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE_OVERRIDE=16384
    -DMQTT_MAX_PACKET_SIZE=16384
    #-DPROJ_DEBUG_ENABLE=1
    #-DCORE_DEBUG_LEVEL=5
    #-DCOMPILE_UNIX_TIME=$UNIX_TIME
lib_deps =
    ArduinoJson
    Wire
    WiFiManager
    GxEPD
    RTClib
    knolleary/PubSubClient@^2.8

[platformio]
src_dir = weather_tiny